name: dnd_ficha_app
version: 0.1.0+1
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  drift: ^2.32.1
  drift_flutter: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.0
  drift_dev: ^2.32.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/srd/
    - assets/data/spells/

  # Cinzel Decorative (Google Fonts, SIL Open Font License 1.1 - ver
  # assets/fonts/OFL-CinzelDecorative.txt). Só os dois pesos usados nos
  # títulos, para não engordar o bundle: o corpo do texto segue na fonte
  # do sistema, que não custa nada.
  fonts:
    - family: CinzelDecorative
      fonts:
        - asset: assets/fonts/CinzelDecorative-Bold.ttf
          weight: 700
        - asset: assets/fonts/CinzelDecorative-Black.ttf
          weight: 900
