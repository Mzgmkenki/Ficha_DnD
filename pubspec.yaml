name: dnd_ficha_app
version: 0.1.0+1
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  drift: ^2.32.1
  drift_flutter: ^0.3.0

  # Retrato do personagem: file_picker abre o gerenciador de arquivos do
  # sistema (SAF no Android), então não precisa de permissão de leitura em
  # runtime. path_provider dá o diretório do app, para onde a imagem é
  # copiada — o caminho devolvido pelo picker fica no cache e pode sumir.
  # Presas na faixa 11.x/2.1.x porque as versões 12/2.1.6 exigem Dart 3.10
  # e o piso declarado aqui é 3.7.0.
  file_picker: ^11.0.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # Exportar a ficha em PDF. `pdf` monta o documento; `printing` entrega ao
  # sistema (compartilhar, salvar ou imprimir) sem precisarmos escrever num
  # diretório e depois pedir um app que abra o arquivo.
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.0
  drift_dev: ^2.32.1

  # Só para o teste conferir os bytes da logo (canal alfa, dimensões, cantos
  # transparentes). Olhar a arte não distingue fundo transparente de fundo
  # branco, e a diferença estraga um dos dois usos.
  image: ^4.5.4

  # Gera os ícones das plataformas a partir de assets/branding/logo_icon.png.
  # Roda à mão (`flutter pub run flutter_launcher_icons`), não no build.
  flutter_launcher_icons: ^0.14.4

# Ícone do app. Só tem efeito depois que a logo existir e o comando rodar;
# ver assets/branding/README.md.
flutter_launcher_icons:
  image_path: assets/branding/logo_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  # Fundo preto do app onde a plataforma exige opacidade, e o ícone adaptativo
  # do Android desenhado sobre ele.
  background_color_ios: '#0A0A0C'
  adaptive_icon_background: '#0A0A0C'
  adaptive_icon_foreground: assets/branding/logo_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/data/srd/
    - assets/data/spells/
    - assets/branding/
    # Declarada também aqui, não só em `fonts:`: o PDF lê o TTF por
    # `rootBundle` para escrever os títulos na mesma fonte da ficha, e o que
    # está apenas em `fonts:` não é acessível por lá.
    - assets/fonts/

  # Cinzel Decorative (Google Fonts, SIL Open Font License 1.1 - ver
  # assets/fonts/OFL-CinzelDecorative.txt). Só os dois pesos usados nos
  # títulos, para não engordar o bundle: o corpo do texto segue na fonte
  # do sistema, que não custa nada.
  fonts:
    - family: CinzelDecorative
      fonts:
        - asset: assets/fonts/CinzelDecorative-Bold.ttf
          weight: 700
        - asset: assets/fonts/CinzelDecorative-Black.ttf
          weight: 900
